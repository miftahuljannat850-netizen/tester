name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────
  # JOB 1: Test & Lint
  # ─────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]  # test on multiple versions

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'               # cache node_modules to speed up

      - name: Install Dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint            # fails pipeline if lint errors exist

      - name: Run Tests
        run: npm test                # runs your jest/mocha tests

  # ─────────────────────────────
  # JOB 2: Deploy to VPS
  # ─────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test                      # only runs if test job passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/privatekey
          chmod 600 ~/.ssh/privatekey
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Project to VPS via SCP
        run: |
          scp -i ~/.ssh/privatekey -r ./* \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app

      - name: Restart App on VPS via SSH
        run: |
          ssh -i ~/.ssh/privatekey \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/app
            npm install --production
            pm2 restart app || pm2 start index.js --name app
          EOF