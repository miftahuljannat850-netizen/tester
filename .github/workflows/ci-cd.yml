name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm install

      - name: Health Check
        run: |
          node server.js &
          sleep 3
          curl --fail http://localhost:5000/api/health
          kill %1

    deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/privatekey
          chmod 600 ~/.ssh/privatekey
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create App Folders on VPS
        run: |
          ssh -i ~/.ssh/privatekey \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "mkdir -p ~/bookapi/backend ~/bookapi/frontend ~/bookapi/backend/uploads"

      - name: Copy Backend to VPS
        run: |
          scp -i ~/.ssh/privatekey -r ./backend/* \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/bookapi/backend/

      - name: Copy Frontend to VPS
        run: |
          scp -i ~/.ssh/privatekey -r ./frontend/* \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/bookapi/frontend/

      - name: Install & Restart App on VPS
        run: |
          ssh -i ~/.ssh/privatekey \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "cd ~/bookapi/backend && npm install --omit=dev && (pm2 restart upload-demo || pm2 start server.js --name upload-demo)"