name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────
  # JOB 1: Build & Test
  # ─────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend   # your server.js is inside /backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm install

      - name: Health Check (verify server starts)
        run: |
          node server.js &
          sleep 3
          curl --fail http://localhost:5000/api/health
          kill %1

  # ─────────────────────────────
  # JOB 2: Deploy to VPS
  # ─────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build                     # only deploy if build passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/privatekey
          chmod 600 ~/.ssh/privatekey
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Backend to VPS
        run: |
          scp -i ~/.ssh/privatekey -r ./backend \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app

      - name: Copy Frontend to VPS
        run: |
          scp -i ~/.ssh/privatekey -r ./frontend \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app

      - name: Install & Restart App on VPS
        run: |
          ssh -i ~/.ssh/privatekey \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/app/backend
            npm install --production
            pm2 restart upload-demo || pm2 start server.js --name upload-demo
          EOF